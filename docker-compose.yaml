services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic_rag_postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: agentic_rag
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C.UTF-8"
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d agentic_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: agentic_rag_postgres_data