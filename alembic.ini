# Alembic-конфиг agentic_rag. URL БД сюда не пишем — он читается из
# settings.database_url в env.py, чтобы не дублировать (и не зашивать
# production-URL в git).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# Формат имени миграции: 0001_initial, 0002_add_something.
# rev_id_length 4 → короткие цифровые id вместо hash — так проще в git
# смотреть порядок миграций глазами.
file_template = %%(rev)s_%%(slug)s

# Часовой пояс timestamp'а в шапке файла миграции. UTC — единый для всех
# сред разработки.
timezone = UTC

# Локаль для сортировки — не влияет.

[post_write_hooks]
# Не используем autoformatter (black/isort и т.п.) — миграции пишем руками
# и держим в едином стиле сами.

# ---- Логи ---------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S